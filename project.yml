name: Cleanora
options:
  bundleIdPrefix: com.cleanora
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Cleanora:
    type: application
    platform: macOS
    sources:
      - Sources
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanora.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Cleanora.entitlements
        CODE_SIGN_STYLE: Automatic
        # Required for notarization; also enables library validation.
        ENABLE_HARDENED_RUNTIME: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
  CleanoraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Cleanora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanora.tests

schemes:
  Cleanora:
    build:
      targets:
        Cleanora: all
        CleanoraTests: [test]
    test:
      targets:
        - CleanoraTests
